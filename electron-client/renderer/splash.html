<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .logo { width: 140px; height: auto; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    p { font-size: 12px; color: #a3a3a3; text-align: center; padding: 0 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="ILSA Support" />
  <div class="spinner"></div>
  <p>ILSA Support açılıyor…<br />İlk açılış 30–60 sn sürebilir (portable).</p>
</body>
</html>
